robot: so101

profile:
  name: example_user
  owner: Example User             # Replace with your name
  description: Smoother recording with slightly smaller steps.

settings:
  motors:
    max_relative_target: 6
  teleop:
    fps: 30
  policy:
    checkpoint: checkpoints/so101/act_pick_v1.pt   # Example path; this file does not exist yet

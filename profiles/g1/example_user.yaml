robot: g1

profile:
  name: example_user
  owner: Example User             # Replace with your name
  description: Slightly faster walking tests, robot on the gantry.

settings:
  locomotion:
    max_forward_speed_m_s: 0.3
  policy:
    checkpoint: checkpoints/g1/walk_v2.pt   # Example path; this file does not exist yet

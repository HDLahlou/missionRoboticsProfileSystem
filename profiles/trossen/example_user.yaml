robot: trossen

profile:
  name: example_user
  owner: Example User             # Replace with your name
  description: Faster teleoperation-style moves for data collection.

settings:
  speed_scale: 0.4
  motion:
    goal_time_s: 1.5
  policy:
    checkpoint: checkpoints/trossen/act_bimanual_v1.pt   # Example path; this file does not exist yet
